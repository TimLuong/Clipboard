    \ var(--secondary), var(--primary));\n  transform: translateY(-2px);\n  box-shadow: var(--shadow-lg);\n}\n\n.custom-btn\
    \ .btn-icon {\n  color: white;\n}\n\n/* ============================================\n   MODAL\n   ============================================\
    \ */\n\n.modal-overlay {\n  position: fixed;\n  inset: 0;\n  background: rgba(0, 0, 0, 0.5);\n  backdrop-filter: blur(8px);\n\
    \  display: flex;\n  align-items: center;\n  justify-content: center;\n  opacity: 0;\n  visibility: hidden;\n  transition:\
    \ all 0.3s ease;\n  z-index: 1000;\n  padding: 20px;\n}\n\n.modal-overlay.active {\n  opacity: 1;\n  visibility: visible;\n\
    }\n\n.modal-content {\n  background: var(--card-bg);\n  border: 1px solid var(--card-border);\n  border-radius: 20px;\n\
    \  backdrop-filter: blur(var(--blur)) saturate(180%);\n  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);\n  width: 100%;\n\
    \  max-width: 500px;\n  overflow: hidden;\n  transform: scale(0.9);\n  transition: transform 0.3s ease;\n}\n\n.modal-overlay.active\
    \ .modal-content {\n  transform: scale(1);\n}\n\n.modal-header {\n  display: flex;\n  align-items: center;\n  justify-content:\
    \ space-between;\n  padding: 20px 24px;\n  border-bottom: 1px solid var(--card-border);\n}\n\n.modal-title {\n  font-size:\
    \ 1.25rem;\n  font-weight: 600;\n  color: var(--text);\n  margin: 0;\n}\n\n.modal-close {\n  background: none;\n  border:\
    \ none;\n  font-size: 1.75rem;\n  color: var(--text-muted);\n  cursor: pointer;\n  width: 32px;\n  height: 32px;\n  display:\
    \ flex;\n  align-items: center;\n  justify-content: center;\n  border-radius: 8px;\n  transition: all 0.2s ease;\n}\n\n\
    .modal-close:hover {\n  background: var(--button-hover);\n  color: var(--text);\n}\n\n.modal-body {\n  padding: 24px;\n\
    \  color: var(--text);\n  max-height: 60vh;\n  overflow-y: auto;\n}\n\n.modal-footer {\n  padding: 16px 24px;\n  border-top:\
    \ 1px solid var(--card-border);\n  display: flex;\n  justify-content: flex-end;\n  gap: 12px;\n}\n\n.btn {\n  padding:\
    \ 10px 20px;\n  border-radius: 12px;\n  font-family: 'Open Sans', sans-serif;\n  font-size: 0.9rem;\n  font-weight: 600;\n\
    \  cursor: pointer;\n  transition: all 0.2s ease;\n  border: none;\n  outline: none;\n}\n\n.btn--primary {\n  background:\
    \ linear-gradient(135deg, var(--primary), var(--secondary));\n  color: white;\n  box-shadow: var(--shadow-sm);\n}\n\n\
    .btn--primary:hover {\n  background: linear-gradient(135deg, var(--secondary), var(--primary));\n  transform: translateY(-1px);\n\
    \  box-shadow: var(--shadow-md);\n}\n\n/* ============================================\n   SPECIAL EFFECTS FOR SPECIFIC\
    \ THEMES\n   ============================================ */\n\n/* Cyberpunk text glow effect */\n[data-theme=\"cyberpunk\"\
    ] .section-title,\n[data-theme=\"cyberpunk\"] .app-title {\n  text-shadow: 0 0 10px var(--primary);\n}\n\n[data-theme=\"\
    cyberpunk\"] .action-btn:hover {\n  box-shadow: 0 0 15px var(--primary), var(--shadow-md);\n}\n\n/* Aurora flowing animation\
    \ */\n[data-theme=\"aurora\"] body {\n  animation: aurora-flow 15s ease-in-out infinite;\n}\n\n@keyframes aurora-flow\
    \ {\n  0%, 100% {\n    background: radial-gradient(circle at 20% 20%, #1a0933 0%, #0F0524 100%);\n  }\n  50% {\n    background:\
    \ radial-gradient(circle at 80% 80%, #1a0933 0%, #0F0524 100%);\n  }\n}\n\n/* Neumorphism pressed effect */\n[data-theme=\"\
    neomorphism\"] .action-btn:active {\n  box-shadow: inset -2px -2px 5px rgba(255,255,255,0.7), inset 2px 2px 5px rgba(0,0,0,0.15);\n\
    }\n\n/* ============================================\n   RESPONSIVE DESIGN\n   ============================================\
    \ */\n\n@media (max-width: 480px) {\n  .app-header {\n    padding: 16px 20px;\n  }\n\n  .app-title {\n    font-size: 1.25rem;\n\
    \  }\n\n  .theme-footer {\n    flex-direction: column;\n    gap: 10px;\n  }\n\n  .theme-dropdown {\n    width: 100%;\n\
    \  }\n\n  .section-card {\n    padding: 16px;\n  }\n\n  .action-btn {\n    padding: 10px 14px;\n    min-height: 44px;\n\
    \    font-size: 0.85rem;\n  }\n\n  .btn-icon {\n    width: 18px;\n    height: 18px;\n  }\n}\n\n@media (min-width: 768px)\
    \ {\n  .app-container {\n    max-width: 480px;\n  }\n}\n\n/* ============================================\n   ACCESSIBILITY\
    \ & ANIMATIONS\n   ============================================ */\n\n/* Focus visible for keyboard navigation */\n*:focus-visible\
    \ {\n  outline: 2px solid var(--primary);\n  outline-offset: 2px;\n}\n\n/* Reduced motion for accessibility */\n@media\
