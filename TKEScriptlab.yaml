    \ class=\"btn btn--primary\">\U0001F4E8 Open Reply Draft</button>\n\t\t</div>\n\t</div>\n</div>\n\n<!-- Modal -->\n<div\
    \ class=\"modal-overlay\" id=\"modalOverlay\">\n\t<div class=\"modal-content\">\n\t\t<div class=\"modal-header\">\n\t\t\
    \t<h3 class=\"modal-title\" id=\"modalTitle\">AI Response</h3>\n\t\t\t<button class=\"modal-close\" id=\"modalClose\"\
    >&times;</button>\n\t\t</div>\n\t\t<div class=\"modal-body\">\n\t\t\t<p id=\"modalMessage\">Processing your request...</p>\n\
    \t\t</div>\n\t\t<div class=\"modal-footer\">\n\t\t\t<button class=\"btn btn--primary\" id=\"modalOk\">OK</button>\n\t\t\
