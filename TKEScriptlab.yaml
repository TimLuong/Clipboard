    \ Generation (ACE Report Format):\n    Create the full coaching document by putting information into the HTML_OUTPUT_TEMPLATE.\
    \ All changing content (extracted data, text you create, and date details) **MUST** go into the correct blank spots. **The\
    \ final HTML output MUST NOT have any \\`[Placeholder: Description]\\` text for any part that you can fill in or create.**\n\
    \n    ---\n\n    1. Coaching Session Overview\n    * Why: Clearly state that the session was to talk about QA feedback\
    \ on the engineer's performance for case [Extracted Case Tracking ID]. The goal is to find and fix any gaps.\n    * What:\
    \ **Write a short summary** of the main topics and exact areas of performance based on the extracted 'missed attributes'\
