    \\n</html>\"\n\n`,\n  coachingDocument: `Objective: Generate a complete and detailed coaching document directly from provided\
    \ QA feedback. Follow the ACE report format strictly. This document will be the final coaching record, with all info filled\
    \ in from your extraction and the exact date given for the coaching session.\n\nKey Requirements & Constraints:\n* SMART\
    \ Goals: Create **two separate SMART goals (Goal 1 and Goal 2)**. Each goal should be a short, easy-to-read paragraph,\
