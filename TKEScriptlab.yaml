    \ e.g., documenting feedback sessions and showing changes based on suggestions], which is possible because [Reason, e.g.,\
    \ dedicated time is set for self-development] and directly important to [Impact, e.g., improving team efficiency and reducing\
    \ callbacks].\"\n    * Commitment: **Engineer agrees verbally** to follow the action plan and meet deadlines.\n\n    ---\n\
    \n    5. Manager Success Action Plan\n    * Action 1 (SMART): **[Manager's first specific, measurable, achievable, relevant,\
    \ and time-bound action to support the engineer (e.g., provide training, schedule follow-ups, offer resources)].**\n \
