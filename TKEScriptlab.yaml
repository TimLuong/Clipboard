    \ or actions** to fix the improvement areas. (Example: \"Learn new process; Practice a skill; Get help from a peer.\"\
    )\n    * First Steps (Action Plan): **Make a simple list of 2-3 first steps** the engineer will take. Each step should\
    \ be clear. (Example: \"Review guide on [Topic]; Finish [Training]; Talk to [Peer] for advice.\")\n\n    ---\n\n    4.\
    \ Engineer Success Action Plan\n    * SMART Goal 1: **Write a detailed paragraph for the first SMART goal** for the engineer's\
    \ improvement. Include specific details like: \"Goal 1: By [Target Date, e.g., 6 weeks from coaching date], [Engineer\
    \ Name] will [Specific Action, e.g., consistently apply the new documentation process in all cases], measured by [Clear\
    \ Metric, e.g., achieving 95% compliance in next 3 QA audits]. This goal is possible because [Reason, e.g., new training\
    \ materials are available] and important because [Impact, e.g., it will directly lead to higher customer satisfaction].\"\
    \n    * SMART Goal 2: **Write a detailed paragraph for the second SMART goal** for the engineer's improvement. Include\
