    \   * Follow-up Date: **[Calculated Date: Two weeks from the Provided 1:1 Coaching Session Date]**\n    * Acknowledgement:\
    \ **Engineer agrees** they understand the feedback and will follow the action plan.\n\n    ---\n\"input_I_will_provide\"\
