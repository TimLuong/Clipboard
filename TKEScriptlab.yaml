script:
  content: "\n// ==========================================\n// API CONFIG - Azure OpenAI Responses API (sửa key ở đây khi\
    \ rotate)\n// ==========================================\n// IMPORTANT: Thay API_KEY bằng key thực tế trước khi sử dụng.\
    \ Không commit key thật.\nconst API_KEY = 'YOUR_API_KEY_HERE';\nconst API_ENDPOINT = 'https://kamezoko.services.ai.azure.com/openai/v1/responses';\n\
    const API_DEPLOYMENT = 'gpt-5.6-luna';\n\n// ==========================================\n// INITIALIZATION - Wait for\
    \ Office.js AND jQuery\n// ==========================================\nOffice.onReady(() => {\n  console.log('✅ Office.js\
    \ is ready');\n\n  // Reset any pending reply draft when the user switches to a different\n  // email - a cached draft\
    \ generated for the previous item must never be\n  // silently opened against a different one.\n  if (Office?.context?.mailbox?.addHandlerAsync)\
    \ {\n    Office.context.mailbox.addHandlerAsync(Office.EventType.ItemChanged, () => {\n      console.log('\U0001F504 Item\
    \ changed - clearing any pending reply draft.');\n      clearPendingReplyDraft();\n    });\n  }\n\n  $(document).ready(function\
    \ () {\n    console.log('✅ jQuery is ready');\n\n    // Theme setup\n    const savedTheme = localStorage.getItem('app-theme')\
    \ || 'neomorphism';\n    document.body.setAttribute('data-theme', savedTheme);\n    const themeSelector = document.getElementById('themeSelector')\
    \ as HTMLSelectElement;\n    if (themeSelector) {\n      themeSelector.value = savedTheme;\n      themeSelector.addEventListener('change',\
    \ function () {\n        const selectedTheme = (this as HTMLSelectElement).value;\n        console.log('\U0001F3A8 Theme\
    \ changed to:', selectedTheme);\n        document.body.setAttribute('data-theme', selectedTheme);\n        localStorage.setItem('app-theme',\
    \ selectedTheme);\n      });\n    }\n\n    console.log('\U0001F50C Attaching button event handlers...');\n\n    // Button\
    \ event handlers\n    // SECTION 1: EDITING\n    $(\"#writeEmailFromSelectedText\").click(function() {\n      console.log('\U0001F58A\
    ️ Write from selected text clicked');\n      writeEmailFromSelectedText();\n    });\n    $(\"#fineTuneSelectedEmail\"\
    ).click(function() {\n      console.log('⚡ Fine tune clicked');\n      fineTuneSelectedEmail();\n    });\n\n    // SECTION\
    \ 2: COACHING / QA\n    $(\"#prepareCoachingDocument\").click(function() {\n      console.log('\U0001F4DD Prepare coaching\
    \ document clicked');\n      prepareCoachingDocument();\n    });\n    $(\"#coachingDocument\").click(function() {\n  \
    \    console.log('\U0001F4C4 Coaching document clicked');\n      coachingDocument();\n    });\n\n    // SECTION 3: ANALYSIS\n\
    \    $(\"#analyseWhatToDo\").click(function() {\n      console.log('\U0001F914 Analyse what to do clicked');\n      analyseWhatToDo();\n\
    \    });\n    $(\"#analyzeEmailTimeline\").click(function() {\n      console.log('\U0001F4CA Timeline analysis clicked');\n\
    \      analyzeEmailTimeline();\n    });\n    $(\"#summarizeEmailThread\").click(function() {\n      console.log('\U0001F4DD\
    \ Summarize email clicked');\n      summarizeEmailThread();\n    });\n\n    // SECTION 4: CUSTOM\n    $(\"#sendCustomRequest\"\
    ).click(function() {\n      console.log('\U0001F680 Custom request clicked');\n      sendCustomRequest();\n    });\n\n\
    \    // Reply-Ready Banner: the \"Open Reply Draft\" click is itself a fresh\n    // user gesture, so the native API call\
    \ happens right here rather than\n    // right after an AI network delay.\n    $(\"#openReplyDraftBtn\").click(function()\
    \ {\n      console.log('\U0001F4E8 Open Reply Draft clicked');\n      if (pendingReplyDraft) {\n        const { htmlBody,\
    \ actionName, rawText } = pendingReplyDraft;\n        hideReplyReadyBanner();\n        tryDisplayReplyAll(htmlBody, actionName,\
    \ rawText);\n      }\n    });\n    $(\"#dismissReplyBanner\").click(function() {\n      console.log('\U0001F5D1️ Reply\
    \ draft dismissed');\n      clearPendingReplyDraft();\n    });\n\n    console.log('✅ All button handlers attached successfully');\n\
    \  });\n});\n\n// ==========================================\n// MODAL HELPERS\n// ==========================================\n\
    function showModal(title: string, message: string) {\n  $('#modalTitle').text(title);\n  $('#modalMessage').html(message);\n\
    \  $('#modalOverlay').addClass('active');\n}\n\nfunction hideModal() {\n  $('#modalOverlay').removeClass('active');\n\
    }\n\n$('#modalClose').on('click', hideModal);\n$('#modalOk').on('click', hideModal);\n\n// ==========================================\n\
    // EMAIL EXTRACTION & CLEANING\n// ==========================================\nlet output = ``;\n\nfunction removeKeywords(text:\
    \ string, keywords: string[]): string {\n  let cleaned = text;\n  keywords.forEach((keyword) => {\n    const regex = new\
    \ RegExp(keyword.replace(/[-/\\\\^$*+?.()|[\\]{}]/g, '\\\\$&'), 'gi');\n    cleaned = cleaned.replace(regex, '');\n  });\n\
    \  return cleaned;\n}\n\nfunction cleanEmailBody(body: string): string {\n  if (!body) return '';\n\n  let cleaned = body;\n\
    \n  cleaned = cleaned.replace(/(?:https?|ftp):\\/\\/[^\\s<>\\[\\]]+/gi, '[URL removed]');\n  cleaned = cleaned.replace(/mailto:[^\\\
    s<>\\[\\]]+/gi, '');\n  cleaned = cleaned.replace(/(\\r?\\n){3,}/g, '\\n\\n');\n  cleaned = cleaned.replace(/^[Cc][Cc]:.*$/gm,\
    \ '');\n  cleaned = cleaned.replace(/^[Bb][Cc][Cc]:.*$/gm, '');\n  cleaned = cleaned.replace(/\\[cid:[^\\]]+\\]/gi, '[Image]');\n\
    \  cleaned = cleaned.replace(/<image\\d*>/gi, '[Image]');\n  cleaned = cleaned.replace(/[-_]{10,}/g, '---');\n  cleaned\
    \ = cleaned.replace(/[=]{10,}/g, '===');\n\n  cleaned = removeKeywords(cleaned, [\n    'Thank and best regards,',\n  \
    \  'Thanks and best regards,',\n    'Best regards,',\n    'Kind regards,',\n    'Warm regards,',\n    'Regards,',\n  \
    \  'Support Consultant',\n    'Support Engineer',\n    'Senior Support Engineer',\n    'Sent from my iPhone',\n    'Sent\
    \ from my Android',\n    'Get Outlook for iOS',\n    'Get Outlook for Android',\n  ]);\n\n  cleaned = cleaned.replace(/(?:Tel|Phone|Fax|Mobile|Cell):\\\
    s*[\\d\\s\\-\\+\\(\\)]+/gi, '');\n  return cleaned.trim();\n}\n\nfunction smartTruncate(text: string, maxLength: number):\
    \ string {\n  if (text.length <= maxLength) return text;\n  let truncated = text.slice(-maxLength);\n  const fromIndex\
    \ = truncated.indexOf('\\nFrom:');\n  if (fromIndex > 0) {\n    truncated = '...[Previous emails truncated]...\\n' + truncated.substring(fromIndex\
    \ + 1);\n  }\n  return truncated;\n}\n\nfunction getOutput(): Promise<string> {\n  return new Promise((resolve, reject)\
    \ => {\n    try {\n      const item = Office.context.mailbox.item;\n      if (!item) {\n        reject(new Error('No email\
    \ item available'));\n        return;\n      }\n\n      const from = item.from?.emailAddress || 'Unknown sender';\n  \
    \    const sent = item.dateTimeCreated\n        ? new Date(item.dateTimeCreated).toLocaleString('en-US', {\n         \
    \   weekday: 'long',\n            month: 'long',\n            day: 'numeric',\n            year: 'numeric',\n        \
    \    hour: 'numeric',\n            minute: 'numeric',\n            timeZoneName: 'short',\n          })\n        : 'Unknown\
    \ date';\n      const to = item.to && Array.isArray(item.to)\n        ? item.to.map((recipient: { emailAddress: string\
    \ }) => recipient.emailAddress).join(', ')\n        : 'Unknown recipient';\n      const subject = item.subject || 'No\
    \ subject';\n\n      item.body.getAsync(Office.CoercionType.Text, {}, function (result: Office.AsyncResult<string>) {\n\
    \        if (result.status !== Office.AsyncResultStatus.Succeeded) {\n          reject(new Error(result.error?.message\
    \ || 'Unknown error getting email body'));\n          return;\n        }\n\n        let body = cleanEmailBody(result.value\
    \ || '');\n        const formattedOutput = `From: ${from}\\nSent: ${sent}\\nTo: ${to}\\nSubject: ${subject}\\nEmail body:\
    \ ${body}`;\n        output = formattedOutput;\n\n        const maxLength = 150000;\n        const finalOutput = formattedOutput.length\
    \ > maxLength ? smartTruncate(formattedOutput, maxLength) : formattedOutput;\n        resolve(finalOutput);\n      });\n\
    \    } catch (error: any) {\n      reject(new Error(error.message || 'Failed to extract email content'));\n    }\n  });\n\
    }\n\n// ==========================================\n// AI CALLER\n// ==========================================\nasync\
    \ function aiPrompt(systemRoleName: string, prompt: string): Promise<string> {\n  console.log('\U0001F916 aiPrompt() called\
    \ with role:', systemRoleName);\n  const systemRoleContent = systemRoles[systemRoleName];\n  if (!systemRoleContent) throw\
    \ new Error(`Invalid system role name: ${systemRoleName}`);\n\n  console.log('\U0001F4E1 Sending request to Azure OpenAI\
    \ (Responses API)...');\n  console.log('\U0001F517 Endpoint:', API_ENDPOINT);\n\n  const response = await fetch(API_ENDPOINT,\
    \ {\n    method: 'POST',\n    headers: {\n      'Content-Type': 'application/json',\n      'api-key': API_KEY,\n    },\n\
    \    body: JSON.stringify({\n      model: API_DEPLOYMENT,\n      instructions: systemRoleContent,\n      input: prompt,\n\
    \      max_output_tokens: 16384,\n    }),\n  });\n\n  console.log('\U0001F4E1 Response status:', response.status, response.statusText);\n\
    \n  if (!response.ok) {\n    const errorText = await response.text();\n    console.error('❌ API Error:', errorText);\n\
    \    throw new Error(`Azure OpenAI API error: ${response.status} ${response.statusText}`);\n  }\n\n  const json = await\
    \ response.json();\n  console.log('\U0001F4E6 Response received, parsing...');\n\n  // output[] may also hold \"reasoning\"\
    \ items; keep only output_text parts of \"message\" items\n  const text: string = (json.output || [])\n    .filter((item:\
    \ any) => item.type === 'message')\n    .flatMap((item: any) => item.content || [])\n    .filter((part: any) => part.type\
    \ === 'output_text')\n    .map((part: any) => part.text)\n    .join('');\n  if (!text) {\n    console.error('❌ Invalid\
    \ response format:', JSON.stringify(json));\n    throw new Error(\n      json.status === 'incomplete'\n        ? `Response\
    \ incomplete: ${json.incomplete_details?.reason || 'unknown'}`\n        : 'Invalid response format'\n    );\n  }\n\n \
    \ console.log('✅ AI response parsed successfully, length:', text.length);\n  return text;\n}\n\n// ==========================================\n\
    // MARKDOWN/HTML HELPERS\n// ==========================================\nfunction plainTextToHtml(markdownText: string):\
    \ string {\n  if (!markdownText) return '';\n  let html = markdownText;\n  html = html.replace(/^### (.*$)/gim, '<h3>$1</h3>');\n\
    \  html = html.replace(/^## (.*$)/gim, '<h2>$1</h2>');\n  html = html.replace(/^# (.*$)/gim, '<h1>$1</h1>');\n  html =\
    \ html.replace(/\\*\\*(.*?)\\*\\*/gim, '<strong>$1</strong>');\n  html = html.replace(/\\*(.*?)\\*/gim, '<em>$1</em>');\n\
    \  html = html.replace(/`(.*?)`/gim, '<code>$1</code>');\n  html = html.replace(/\\[(.*?)\\]\\((.*?)\\)/gim, '<a href=\"\
    $2\" target=\"_blank\">$1</a>');\n  html = html.replace(/\\n\\n/g, '</p><p>');\n  html = `<div style=\"font-family: Calibri,\
    \ Arial, sans-serif;\"><p>${html}</p></div>`;\n  return html;\n}\n\nfunction cleanHtmlForOutlookReply(fullHtml: string):\
    \ string {\n  if (!fullHtml) return '';\n\n  // Extract content inside <body>...</body> if present, otherwise strip\n\
    \  // doctype/head/style directly, since Outlook's native reply-all form\n  // rejects full HTML documents but accepts\
    \ inline-styled markup.\n  const bodyMatch = fullHtml.match(/<body[^>]*>([\\s\\S]*?)<\\/body>/i);\n  let cleanContent\
    \ = bodyMatch ? bodyMatch[1] : fullHtml;\n\n  cleanContent = cleanContent\n    .replace(/<!DOCTYPE[\\s\\S]*?>/gi, '')\n\
    \    .replace(/<head[\\s\\S]*?<\\/head>/gi, '')\n    .replace(/<style[\\s\\S]*?<\\/style>/gi, '')\n    .replace(/<\\/?(html|body)[^>]*>/gi,\
    \ '')\n    .replace(/```html/gi, '')\n    .replace(/```/gi, '');\n\n  return cleanContent.trim();\n}\n\n// ==========================================\n\
    // REPLY-READY BANNER (two-step flow)\n// ==========================================\n// Calling displayReplyAllFormAsync()\
    \ right after an `await aiPrompt(...)`\n// network call can silently fail: the browser's \"trusted user gesture\"\n//\
    \ from the original button click has expired by the time the AI response\n// arrives (typically several seconds later),\
    \ so Outlook Web/WebView2\n// blocks the compose UI transition even though Office.js reports\n// `succeeded`. To guarantee\
    \ the native call always runs on a fresh click,\n// the AI result is cached here and a banner asks the user to click\n\
    // \"Open Reply Draft\" - THAT click is the fresh gesture that opens the form.\nlet pendingReplyDraft: { htmlBody: string;\
    \ actionName: string; rawText: string } | null = null;\n\nfunction queueReplyDraft(htmlBody: string, actionName: string,\
    \ rawText: string) {\n  pendingReplyDraft = { htmlBody, actionName, rawText };\n  showReplyReadyBanner(actionName);\n\
    }\n\nfunction showReplyReadyBanner(actionName: string) {\n  const overlay = document.getElementById('replyReadyOverlay');\n\
    \  const text = document.getElementById('replyReadyText');\n  if (text) text.textContent = `Your \"${actionName}\" response\
    \ is ready to send.`;\n  if (overlay) overlay.classList.add('active');\n}\n\nfunction hideReplyReadyBanner() {\n  const\
    \ overlay = document.getElementById('replyReadyOverlay');\n  if (overlay) overlay.classList.remove('active');\n}\n\nfunction\
    \ clearPendingReplyDraft() {\n  pendingReplyDraft = null;\n  hideReplyReadyBanner();\n}\n\nfunction tryDisplayReplyAll(htmlBody:\
    \ string, actionName: string, rawText: string) {\n  // displayReplyAllForm requires Mailbox 1.8 and is supported in Outlook\
    \ on\n  // the web, Windows, and Mac - there's no host-specific restriction, so we\n  // always attempt it and only fall\
    \ back to the modal if it's unsupported\n  // or the call itself fails (handled below).\n  const requirementsSupported\
    \ =\n    Office?.context?.requirements?.isSetSupported &&\n    Office.context.requirements.isSetSupported('Mailbox', '1.8');\n\
    \n  if (!requirementsSupported) {\n    console.warn('⚠️ Mailbox 1.8 not supported in this host; showing modal instead.');\n\
    \    showModal(actionName, htmlBody);\n    return;\n  }\n\n  const item = Office?.context?.mailbox?.item;\n\n  if (!item\
    \ || typeof item.displayReplyAllFormAsync !== 'function') {\n    console.warn('⚠️ displayReplyAllFormAsync is not available\
    \ in this context/mode (e.g. Compose mode). Falling back to modal.');\n    showModal(actionName, htmlBody);\n    return;\n\
    \  }\n\n  // The native reply-all form silently rejects full HTML documents\n  // (<!DOCTYPE>/<head>/<style>), so always\
    \ strip down to inline markup\n  // before calling it. The modal fallback still uses the original\n  // htmlBody so rich/full-document\
    \ content isn't lost if this fails.\n  const inlineBody = cleanHtmlForOutlookReply(htmlBody);\n\n  try {\n    item.displayReplyAllFormAsync(inlineBody,\
    \ (result) => {\n      console.log('\U0001F4CB displayReplyAllFormAsync result:', JSON.stringify(result));\n      if (result.status\
    \ !== Office.AsyncResultStatus.Succeeded) {\n        console.error('❌ displayReplyAllFormAsync failed:', result.error);\n\
    \        console.log('⚠️ Falling back to modal dialog');\n        showModal(actionName, htmlBody);\n        return;\n\
    \      }\n      console.log('✅ Reply-all form displayed (renders inline at the bottom of the reading pane, not as a separate\
    \ pop-up window - scroll down if you don\\'t see it).');\n    });\n  } catch (err: any) {\n    console.error('❌ Exception\
    \ during displayReplyAllFormAsync call:', err);\n    showModal(actionName, htmlBody);\n  }\n}\n\nfunction getSelectedTextAsync():\
    \ Promise<string> {\n  return new Promise((resolve, reject) => {\n    Office.context.mailbox.item.getSelectedDataAsync(Office.CoercionType.Text,\
    \ (asyncResult) => {\n      if (asyncResult.status === Office.AsyncResultStatus.Succeeded) {\n        resolve(asyncResult.value.data);\n\
    \      } else {\n        reject(new Error(`Error getting selected text: ${asyncResult.error.message}`));\n      }\n  \
    \  });\n  });\n}\n\nfunction replaceSelectionWithText(newText: string) {\n  Office.context.mailbox.item.body.getTypeAsync((asyncResult)\
    \ => {\n    if (asyncResult.status === Office.AsyncResultStatus.Failed) {\n      console.log('Action failed with error:\
    \ ' + asyncResult.error.message);\n      return;\n    }\n    const bodyFormat = asyncResult.value;\n    Office.context.mailbox.item.body.setSelectedDataAsync(newText,\
    \ { coercionType: bodyFormat }, (setResult) => {\n      if (setResult.status === Office.AsyncResultStatus.Failed) {\n\
    \        console.log('Action failed with error: ' + setResult.error.message);\n      }\n    });\n  });\n}\n\n// ==========================================\n\
