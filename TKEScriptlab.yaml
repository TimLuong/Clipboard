    \ Session Date]**\n    * Time: **45-60 min duration**\n\n    ---\n\n    3. Quick Analysis\n    * Good Points: **Write\
    \ a very short paragraph** summarizing the positive feedback.\n    * Areas to Improve: **Write a very short paragraph**\
    \ identifying the main areas needing improvement from the QA feedback. Briefly state each problem. (Example: \"QA feedback\
    \ showed two main areas to improve: [Main Area 1] had [brief problem 1]. Also, [Main Area 2] showed [brief problem 2].\"\
    )\n    * Main Reasons: **Make a simple list of 2-3 possible reasons** for each improvement area. (Example: \"Not enough\
