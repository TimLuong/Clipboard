    \n\t<!-- Theme Switcher at Bottom -->\n\t<footer class=\"theme-footer\">\n\t\t<label for=\"themeSelector\" class=\"theme-label\"\
    >Theme</label>\n\t\t<select id=\"themeSelector\" class=\"theme-dropdown\">\n\t\t\t<option value=\"neomorphism\">☁️ Neumorphism\
    \ Soft</option>\n\t\t\t<option value=\"glassmorphism\">✨ Glassmorphism Light</option>\n\t\t\t<option value=\"glass-dark\"\
    >\U0001F319 Glassmorphism Dark</option>\n\t\t\t<option value=\"glass-purple\">\U0001F49C Glassmorphism Purple</option>\n\
    \t\t\t<option value=\"aurora\">\U0001F30C Aurora Gradient</option>\n\t\t\t<option value=\"claymorphism\">\U0001F3A8 Claymorphism</option>\n\
    \t\t\t<option value=\"cyberpunk\">⚡ Cyberpunk Neon</option>\n\t\t\t<option value=\"creative\">\U0001F496 Creative Agency</option>\n\
    \t\t\t<option value=\"minimal-saas\">\U0001F4F1 Minimal SaaS</option>\n\t\t\t<option value=\"ocean\">\U0001F30A Ocean\
    \ Deep</option>\n\t\t</select>\n\t</footer>\n</div>\n\n<!-- Reply-Ready Popup: shown after AI generation completes, so\
    \ the native\n     reply-all form is opened on a fresh user click (avoids the browser\n     gesture-token expiring during\
    \ the AI network delay). Reuses the modal\n     overlay/content styling for a centered, unmissable popup. -->\n<div class=\"\
    modal-overlay reply-ready-overlay\" id=\"replyReadyOverlay\">\n\t<div class=\"modal-content reply-ready-popup\">\n\t\t\
    <div class=\"modal-header\">\n\t\t\t<h3 class=\"modal-title\">\U0001F4E8 Draft Ready</h3>\n\t\t</div>\n\t\t<div class=\"\
    modal-body\">\n\t\t\t<p id=\"replyReadyText\">Your AI response is ready.</p>\n\t\t</div>\n\t\t<div class=\"modal-footer\"\
