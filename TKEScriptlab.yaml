    \ 45-60 min duration)**\n    * How: Explain that the meeting used a helpful and teamwork-based approach. It focused on\
    \ direct feedback and personal support.\n\n    ---\n\n    2. Session Information\n    * SE Name: [Extracted Engineer's\
    \ Full Name]\n    * SE Email: [Extracted Engineer's Email Address, if available]\n    * Department: [Extracted Department\
