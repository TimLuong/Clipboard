    }`,\n  engineer: ``,\n};\n\n// ==========================================\n\n// ==========================================\n\
    // HELPER FUNCTIONS - PARSE & DISPLAY EMAIL\n// ==========================================\n\n/**\n * PARSE JSON RESPONSE\
    \ TỪ AI VÀ HIỂN THỊ EMAIL\n *\n * Function này xử lý response từ AI (format JSON) và hiển thị trong Outlook\n *\n * Workflow:\n\
    \ * 1. Parse JSON response (format: {greeting, body})\n * 2. Combine greeting + body\n * 3. Convert plain text → HTML\n\
    \ * 4. Display bằng displayReplyAllForm()\n *\n * @param response - JSON string từ AI (hoặc plain text nếu parse fail)\n\
    \ * @param fallbackMode - Có sử dụng fallback (plain text) nếu parse fail không (default: true)\n * @returns true nếu\
    \ thành công, false nếu fail\n */\nfunction parseAndDisplayEmail(response: string, fallbackMode: boolean = true): boolean\
    \ {\n  try {\n    // Log raw response for debugging\n    console.log(`Raw API response (first 200 chars): ${response.substring(0,\
    \ 200)}`);\n    \n    // Loại bỏ markdown code blocks và extract JSON object\n    let cleanResponse = response.trim();\n\
    \    \n    // Remove markdown code blocks if present\n    if (cleanResponse.includes('```')) {\n      const codeBlockMatch\
    \ = cleanResponse.match(/```(?:json)?\\s*\\n?([\\s\\S]*?)\\n?```/);\n      if (codeBlockMatch && codeBlockMatch[1]) {\n\
    \        cleanResponse = codeBlockMatch[1].trim();\n      } else {\n        cleanResponse = cleanResponse.replace(/```json\\\
    n?/g, '').replace(/```\\n?/g, '');\n      }\n    }\n    \n    // Find first { and last } to extract only the JSON object\n\
    \    const firstBrace = cleanResponse.indexOf('{');\n    const lastBrace = cleanResponse.lastIndexOf('}');\n    \n   \
    \ if (firstBrace !== -1 && lastBrace !== -1 && firstBrace < lastBrace) {\n      // Extract only the JSON object content\n\
    \      cleanResponse = cleanResponse.substring(firstBrace, lastBrace + 1);\n    } else if (!cleanResponse.startsWith('{'))\
    \ {\n      console.warn(`No valid JSON object found. Response preview: \"${cleanResponse.substring(0, 100)}\"`);\n   \
    \   throw new Error('Response is not valid JSON format');\n    }\n\n    // Parse JSON response\n    const emailData =\
    \ JSON.parse(cleanResponse);\n\n    // Validate JSON structure\n    if (!emailData.greeting || !emailData.body) {\n  \
    \    console.warn(\"JSON missing 'greeting' or 'body' fields\", emailData);\n      throw new Error('Invalid JSON structure');\n\
    \    }\n\n    // Combine greeting và body (signature sẽ tự động được Outlook thêm vào)\n    const fullEmail = `${emailData.greeting}\\\
    n\\n${emailData.body}`;\n\n    // Convert plain text → HTML và hiển thị\n    const htmlContent = plainTextToHtml(fullEmail);\n\
    \    Office.context.mailbox.item.displayReplyAllForm({ htmlBody: htmlContent });\n\n    return true;\n  } catch (parseError)\
    \ {\n    console.error(\"Failed to parse JSON response\", parseError);\n\n    if (fallbackMode) {\n      // Fallback:\
    \ Sử dụng raw response (plain text) nếu parse JSON fail\n      console.log(\"Using fallback mode (raw response)\");\n\
    \      const htmlContent = plainTextToHtml(response);\n      Office.context.mailbox.item.displayReplyAllForm({ htmlBody:\
    \ htmlContent });\n      return true;\n    }\n\n    return false;\n  }\n}\n\n/**\n * THÊM JSON OUTPUT INSTRUCTION VÀO\
    \ PROMPT\n *\n * Helper function để thêm hướng dẫn JSON output vào bất kỳ prompt nào\n * Dùng cho các function cũ chưa\
    \ migrate sang modular prompt system\n *\n * @param prompt - Prompt gốc\n * @returns Prompt + JSON output instruction\n\
    \ */\nfunction addJsonOutputInstruction(prompt: string): string {\n  return prompt + `\n\nCRITICAL OUTPUT FORMAT REQUIREMENTS:\n\
    You MUST return ONLY a valid JSON object. Follow these rules EXACTLY:\n\n1. Start your response with { (opening curly\
    \ brace)\n2. End your response with } (closing curly brace)\n3. Use this exact structure:\n{\n  \"greeting\": \"Dear [FirstName],\"\
    \ or \"Hi [FirstName],\",\n  \"body\": \"Email body paragraphs here without signature...\"\n}\n\n4. DO NOT include:\n\
    \   - Markdown code blocks (no \\`\\`\\`json or \\`\\`\\`)\n   - Numbered lists (like 1., 2., 3.)\n   - Any text before\
    \ the opening {\n   - Any text after the closing }\n   - Signature lines (\"Warm regards\", \"Tim Luong\")\n   - Explanations\
    \ or commentary outside the JSON\n\n5. The \"body\" field should contain ONLY the email content (no signature)\n6. Use\
    \ proper JSON string escaping for quotes and special characters\n\nEXAMPLE VALID OUTPUT:\n{\n  \"greeting\": \"Dear John,\"\
    ,\n  \"body\": \"Thank you for your patience while we investigated this issue.\\\\n\\\\nI'm pleased to confirm that the\
    \ problem has been resolved. Our team identified the root cause and implemented a fix that should prevent this from happening\
    \ again.\\\\n\\\\nPlease let me know if you have any questions or concerns.\"\n}\n\nRemember: Your ENTIRE response must\
    \ be valid, parseable JSON - nothing else!`;\n}\n\n// ==========================================\n// CORE FUNCTIONS -\
    \ EXTRACT & CALL AI\n// ==========================================\n\n// Biến toàn cục lưu trữ email thread output tạm\
    \ thời\nlet output = ``;\n\n/**\n * TRÍCH XUẤT NỘI DUNG EMAIL THREAD TỪ OUTLOOK\n *\n * Function quan trọng nhất - extract\
    \ toàn bộ email conversation từ Outlook\n *\n * Workflow:\n * 1. Lấy metadata: From, Sent, To, Subject\n * 2. Lấy body\
    \ email dạng plain text (getAsync)\n * 3. Clean content: loại bỏ URLs, blank lines, signatures, \"Cc:\" lines\n * 4. Format\
    \ thành string: \"From: ...\\nSent: ...\\nTo: ...\\nSubject: ...\\nEmail body: ...\"\n * 5. Truncate nếu quá dài (giữ\
    \ 993330 chars cuối)\n *\n * @returns Promise<string> - Email thread đã được format\n */\nfunction getOutput(): Promise<string>\
    \ {\n  return new Promise((resolve, reject) => {\n    try {\n      // 1. Extract metadata từ Outlook email item với null\
    \ checks\n      const item = Office.context.mailbox.item;\n      \n      if (!item) {\n        reject(new Error(\"No email\
    \ item available\"));\n        return;\n      }\n\n      const from = item.from?.emailAddress || \"Unknown sender\";\n\
    \      const sent = item.dateTimeCreated \n        ? new Date(item.dateTimeCreated).toLocaleString(\"en-US\", {\n    \
    \        weekday: \"long\",\n            month: \"long\",\n            day: \"numeric\",\n            year: \"numeric\"\
    ,\n            hour: \"numeric\",\n            minute: \"numeric\",\n            timeZoneName: \"short\",\n          })\n\
    \        : \"Unknown date\";\n      \n      const to = item.to && Array.isArray(item.to) \n        ? item.to.map((recipient:\
    \ { emailAddress: string }) => recipient.emailAddress).join(\", \")\n        : \"Unknown recipient\";\n      \n      const\
    \ subject = item.subject || \"No subject\";\n\n      // 2. Lấy email body dạng plain text (async)\n      item.body.getAsync(\n\
    \        Office.CoercionType.Text,\n        { asyncContext: \"This is passed to the callback\" },\n        function (result:\
    \ Office.AsyncResult<string>) {\n          if (result.status === Office.AsyncResultStatus.Succeeded) {\n            let\
    \ body = result.value || \"\";\n\n            // 3. Clean email body - comprehensive cleaning\n            body = cleanEmailBody(body);\n\
    \n            // 4. Format thành string hoàn chỉnh\n            const formattedOutput = `From: ${from}\\nSent: ${sent}\\\
    nTo: ${to}\\nSubject: ${subject}\\nEmail body: ${body}`;\n            \n            const rawTokens = formattedOutput.length;\n\
    \            console.log(\"Number of characters in RAW email extracted: \" + rawTokens);\n\n            // 5. Smart truncation\
    \ với proper boundary detection\n            let finalOutput: string;\n            const maxLength = 993330; // ~248k\
    \ tokens\n            \n            if (formattedOutput.length > maxLength) {\n              console.log(\"Email thread\
    \ exceeds max length, truncating...\");\n              finalOutput = smartTruncate(formattedOutput, maxLength);\n    \
    \        } else {\n              finalOutput = formattedOutput;\n            }\n\n            // 6. Final validation\n\
    \            if (!finalOutput || finalOutput.trim().length === 0) {\n              reject(new Error(\"Email content is\
    \ empty after processing\"));\n              return;\n            }\n\n            console.log(\"Number of characters\
    \ after processing: \" + finalOutput.length);\n            resolve(finalOutput);\n          } else {\n            const\
    \ errorMessage = result.error?.message || \"Unknown error getting email body\";\n            console.error(`Error: ${errorMessage}`);\n\
    \            reject(new Error(errorMessage));\n          }\n        },\n      );\n    } catch (error: any) {\n      console.error(\"\
    Error in getOutput:\", error);\n      reject(new Error(error.message || \"Failed to extract email content\"));\n    }\n\
    \  });\n}\n\n/**\n * CLEAN EMAIL BODY - Comprehensive cleaning function\n * \n * Removes:\n * - URLs (http/https)\n *\
    \ - Blank lines (excessive whitespace)\n * - Cc/CC lines\n * - Common signatures\n * - Confidentiality disclaimers\n *\
    \ - Image placeholders\n * - Excessive dashes/underscores\n */\nfunction cleanEmailBody(body: string): string {\n  if\
    \ (!body) return \"\";\n\n  let cleaned = body;\n\n  // Remove URLs (http, https, ftp)\n  cleaned = cleaned.replace(/(?:https?|ftp):\\\
    /\\/[^\\s<>\\[\\]]+/gi, \"[URL removed]\");\n\n  // Remove email-style URLs (mailto:)\n  cleaned = cleaned.replace(/mailto:[^\\\
    s<>\\[\\]]+/gi, \"\");\n\n  // Remove blank lines (but keep single line breaks for structure)\n  cleaned = cleaned.replace(/(\\\
    r?\\n){3,}/g, \"\\n\\n\");\n\n  // Remove Cc/CC lines\n  cleaned = cleaned.replace(/^[Cc][Cc]:.*$/gm, \"\");\n\n  // Remove\
    \ Bcc lines\n  cleaned = cleaned.replace(/^[Bb][Cc][Cc]:.*$/gm, \"\");\n\n  // Remove image placeholders\n  cleaned =\
    \ cleaned.replace(/\\[cid:[^\\]]+\\]/gi, \"[Image]\");\n  cleaned = cleaned.replace(/<image\\d*>/gi, \"[Image]\");\n\n\
    \  // Remove excessive dashes/underscores (often used as separators)\n  cleaned = cleaned.replace(/[-_]{10,}/g, \"---\"\
    );\n  cleaned = cleaned.replace(/[=]{10,}/g, \"===\");\n\n  // Remove common confidentiality disclaimers\n  const disclaimerPatterns\
    \ = [\n    /This email and any attachments are confidential[\\s\\S]*?(?=From:|$)/gi,\n    /CONFIDENTIALITY NOTICE[\\s\\\
    S]*?(?=From:|$)/gi,\n    /This message is intended only for[\\s\\S]*?(?=From:|$)/gi,\n    /DISCLAIMER[\\s\\S]*?(?=From:|$)/gi,\n\
    \    /If you have received this email in error[\\s\\S]*?(?=From:|$)/gi,\n  ];\n\n  for (const pattern of disclaimerPatterns)\
    \ {\n    cleaned = cleaned.replace(pattern, \"\\n[Disclaimer removed]\\n\");\n  }\n\n  // Remove common signatures using\
    \ removeKeywords helper\n  cleaned = removeKeywords(cleaned, [\n    \"Thank and best regards,\",\n    \"Thanks and best\
    \ regards,\",\n    \"Best regards,\",\n    \"Kind regards,\",\n    \"Warm regards,\",\n    \"Regards,\",\n    \"Support\
    \ Consultant\",\n    \"HKBN Group\",\n    \"Technical Support Engineer\",\n    \"Senior Support Engineer\",\n    \"Support\
    \ Engineer\",\n    \"Microsoft Dynamics 365\",\n    \"Sent from my iPhone\",\n    \"Sent from my Android\",\n    \"Get\
    \ Outlook for iOS\",\n    \"Get Outlook for Android\",\n  ]);\n\n  // Remove phone/fax patterns (optional - keeps info\
    \ but reduces noise)\n  cleaned = cleaned.replace(/(?:Tel|Phone|Fax|Mobile|Cell):\\s*[\\d\\s\\-\\+\\(\\)]+/gi, \"\");\n\
    \n  // Trim whitespace\n  cleaned = cleaned.trim();\n\n  return cleaned;\n}\n\n/**\n * SMART TRUNCATE - Truncate email\
    \ at proper boundaries\n * \n * Keeps the most recent emails (end of thread) and finds proper\n * boundary points to avoid\
    \ cutting in the middle of a message.\n */\nfunction smartTruncate(text: string, maxLength: number): string {\n  if (text.length\
    \ <= maxLength) {\n    return text;\n  }\n\n  // Keep the end (most recent emails are more important)\n  let truncated\
    \ = text.slice(-maxLength);\n\n  // Find a proper boundary to start from\n  const boundaryPatterns = [\n    /\\nFrom:\\\
    s/,           // Email header\n    /\\n_{3,}\\n/,           // Separator line\n    /\\n-{3,}\\n/,           // Dash separator\n\
    \    /\\nOn .* wrote:\\n/,    // Reply header pattern\n    /\\n\\n/,                // Double line break\n  ];\n\n  let\
    \ bestBoundary = 0;\n  for (const pattern of boundaryPatterns) {\n    const match = truncated.match(pattern);\n    if\
    \ (match && match.index !== undefined && match.index > bestBoundary && match.index < 1000) {\n      bestBoundary = match.index;\n\
    \    }\n  }\n\n  if (bestBoundary > 0) {\n    truncated = \"...[Previous emails truncated]...\\n\" + truncated.slice(bestBoundary);\n\
    \  } else {\n    truncated = \"...[Previous emails truncated]...\\n\" + truncated;\n  }\n\n  return truncated;\n}\n\n\
    /**\n * GỌI AZURE OPENAI API ĐỂ GENERATE EMAIL\n *\n * Function chính để call AI - được dùng bởi TẤT CẢ các email generation\
    \ functions\n *\n * Workflow:\n * 1. Validate systemRoleName (phải có trong systemRoles object)\n * 2. Tạo request body\
