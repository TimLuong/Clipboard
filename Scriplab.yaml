    \ 3. Call Azure OpenAI /responses endpoint\n * 4. Return AI response text\n *\n * @param systemRoleName - Tên role trong\
    \ systemRoles object (vd: \"teamManager\")\n * @param prompt - Prompt chính đã được build bằng buildPrompt()\n * @returns\
    \ Promise<string> - AI generated text (JSON format hoặc plain text)\n */\nasync function aiPrompt(systemRoleName, prompt)\
    \ {\n  // 1. Validate và lấy system role content từ systemRoles object\n  const systemRoleContent = systemRoles[systemRoleName];\n\
    \  if (!systemRoleContent) {\n    throw new Error(`Invalid system role name: ${systemRoleName}`);\n  }\n\n  // 2. Azure\
    \ OpenAI credentials: xem khối API CONFIG ở đầu file\n  const apiKey = API_KEY;\n  const endpoint = API_ENDPOINT;\n  const\
    \ deploymentName = API_DEPLOYMENT;\n\n  // 3. Setup request headers\n  const headers = new Headers();\n  headers.append(\"\
    Content-Type\", \"application/json\");\n  headers.append(\"api-key\", apiKey);\n\n  // 4. Build request body\n  //   -\
    \ instructions: System role (persona, templates, examples)\n  //   - input: Prompt chính (scenario + email thread)\n \
    \ const body = JSON.stringify({\n    model: deploymentName,\n    instructions: systemRoleContent,  // Persona + style\
    \ guide\n    input: prompt,  // Built prompt từ buildPrompt()\n    max_output_tokens: 16384,  // Max 16k tokens output\n\
    \  });\n\n  // 5. Call Azure OpenAI Responses API\n  try {\n    const response = await fetch(endpoint, {\n      method:\
    \ \"POST\",\n      headers: headers,\n      body: body,\n    });\n\n    if (!response.ok) {\n      const errorText = await\
    \ response.text();\n      console.error(`API error (${response.status}): ${errorText}`);\n      throw new Error(`Network\
    \ response was not ok: ${response.status}`);\n    }\n\n    const json = await response.json();\n\n    // 6. Extract AI\
    \ response text\n    // output[] có thể chứa cả item \"reasoning\"; chỉ lấy phần output_text của item \"message\"\n  \
    \  const text = (json.output || [])\n      .filter((item) => item.type === \"message\")\n      .flatMap((item) => item.content\
    \ || [])\n      .filter((part) => part.type === \"output_text\")\n      .map((part) => part.text)\n      .join(\"\");\n\
    \n    if (!text) {\n      console.error(\"Invalid response structure:\", JSON.stringify(json, null, 2));\n      throw\
    \ new Error(\n        json.status === \"incomplete\"\n          ? `Response incomplete: ${json.incomplete_details?.reason\
    \ || \"unknown\"}`\n          : \"Invalid response format\"\n      );\n    }\n\n    console.log(`AI response length: ${text.length}\
    \ characters`);\n    console.log(`AI response preview (first 300 chars): ${text.substring(0, 300)}`);\n\n    return text;\n\
    \  } catch (error) {\n    console.error(\"Error occurred during API request:\", error);\n    throw error;\n  }\n}\n\n\
