    \      let olMatch = line.match(/^\\s*\\d+\\. (.*)/);\n      if (ulMatch) {\n        if (!inList || listType !== \"ul\"\
    ) {\n          if (inList) output += `</${listType}>`;\n          output += \"<ul>\";\n          inList = true;\n    \
    \      listType = \"ul\";\n        }\n        output += `<li>${ulMatch[1]}</li>`;\n      } else if (olMatch) {\n     \
    \   if (!inList || listType !== \"ol\") {\n          if (inList) output += `</${listType}>`;\n          output += \"<ol>\"\
    ;\n          inList = true;\n          listType = \"ol\";\n        }\n        output += `<li>${olMatch[1]}</li>`;\n  \
    \    } else {\n        if (inList) {\n          output += `</${listType}>`;\n          inList = false;\n          listType\
    \ = null;\n        }\n        output += line;\n      }\n    }\n    if (inList) output += `</${listType}>`;\n    return\
    \ output;\n  }\n}\n"
