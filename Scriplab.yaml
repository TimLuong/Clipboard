style:
  content: "/* Import Professional Fonts - Poppins (Headings) + Open Sans (Body) */\n@import url('https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap');\n\
    \n\n/* THEME: Neumorphism Soft (only theme) */\n[data-theme=\"neomorphism\"],\n:root {\n  --primary: #64B5F6;\n  --secondary:\
    \ #90CAF9;\n  --accent: #42A5F5;\n  --background: #E0E5EC;\n  --background-gradient-start: #E0E5EC;\n  --background-gradient-end:\
    \ #D4D9E0;\n  --text: #2E3A59;\n  --text-muted: #6B7A99;\n  --card-bg: #E0E5EC;\n  --card-border: transparent;\n  --button-bg:\
    \ #E0E5EC;\n  --button-hover: #D4D9E0;\n  --input-bg: #E0E5EC;\n  --input-border: transparent;\n  --blur: 0px;\n  --shadow-sm:\
    \ -3px -3px 7px rgba(255,255,255,0.8), 3px 3px 7px rgba(0,0,0,0.15);\n  --shadow-md: -5px -5px 15px rgba(255,255,255,0.8),\
    \ 5px 5px 15px rgba(0,0,0,0.15);\n  --shadow-lg: -8px -8px 20px rgba(255,255,255,0.9), 8px 8px 20px rgba(0,0,0,0.2);\n\
    }\n\n/* ============================================\n   GLOBAL STYLES\n   ============================================\
    \ */\n\n* {\n  box-sizing: border-box;\n  margin: 0;\n  padding: 0;\n}\n\nbody {\n  font-family: 'Open Sans', -apple-system,\
    \ BlinkMacSystemFont, 'Segoe UI', sans-serif;\n  min-height: 100vh;\n  background: radial-gradient(circle at 20% 20%,\
    \ var(--background-gradient-start) 0%, var(--background-gradient-end) 100%);\n  color: var(--text);\n  line-height: 1.6;\n\
    \  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n  overflow-x: hidden;\n  transition: background\
    \ 0.5s ease, color 0.3s ease;\n}\n\nh1, h2, h3, h4, h5, h6 {\n  font-family: 'Poppins', sans-serif;\n  font-weight: 600;\n\
    }\n\n/* ============================================\n   HEADER WITH THEME SWITCHER\n   ============================================\
    \ */\n\n.app-header {\n  background: var(--card-bg);\n  border: 1px solid var(--card-border);\n  backdrop-filter: blur(var(--blur))\
    \ saturate(180%);\n  border-radius: 20px;\n  box-shadow: var(--shadow-md);\n  padding: 20px 24px;\n  margin-bottom: 20px;\n\
    \  text-align: center;\n  transition: all 0.3s ease;\n}\n\n.app-title {\n  font-size: 1.5rem;\n  font-weight: 600;\n \
    \ color: var(--text);\n  margin: 0;\n}\n\n/* ============================================\n   CONTAINER & LAYOUT\n   ============================================\
    \ */\n\n.app-container {\n  width: 100%;\n  max-width: 420px;\n  margin: 0 auto;\n  padding: 20px 16px 32px;\n}\n\n.main-content\
    \ {\n  display: flex;\n  flex-direction: column;\n  gap: 20px;\n}\n\n/* ============================================\n\
    \   SECTION CARDS\n   ============================================ */\n\n.section-card {\n  background: var(--card-bg);\n\
    \  border: 1px solid var(--card-border);\n  border-radius: 20px;\n  backdrop-filter: blur(var(--blur)) saturate(180%);\n\
    \  box-shadow: var(--shadow-md);\n  padding: 20px;\n  transition: transform 0.3s ease, box-shadow 0.3s ease;\n}\n\n.section-card:hover\
    \ {\n  transform: translateY(-2px);\n  box-shadow: var(--shadow-lg);\n}\n\n/* Section Header */\n.section-header {\n \
    \ display: flex;\n  align-items: center;\n  gap: 10px;\n  margin-bottom: 16px;\n}\n\n.section-icon-wrapper {\n  display:\
    \ flex;\n  align-items: center;\n  justify-content: center;\n  width: 32px;\n  height: 32px;\n  border-radius: 10px;\n\
    \  background: linear-gradient(135deg, var(--primary), var(--secondary));\n  color: white;\n  transition: transform 0.3s\
    \ ease;\n}\n\n.section-card:hover .section-icon-wrapper {\n  transform: scale(1.1) rotate(5deg);\n}\n\n.section-icon {\n\
    \  width: 20px;\n  height: 20px;\n  stroke-width: 2.5;\n}\n\n.section-title {\n  font-size: 1.15rem;\n  font-weight: 600;\n\
    \  color: var(--text);\n  margin: 0;\n}\n\n/* ============================================\n   BUTTONS\n   ============================================\
    \ */\n\n.button-grid {\n  display: flex;\n  flex-direction: column;\n  gap: 10px;\n}\n\n.action-btn {\n  display: flex;\n\
    \  align-items: center;\n  gap: 12px;\n  padding: 12px 16px;\n  min-height: 48px;\n  border-radius: 14px;\n  border: 1px\
    \ solid var(--card-border);\n  background: var(--button-bg);\n  color: var(--text);\n  font-family: 'Open Sans', sans-serif;\n\
    \  font-size: 0.9rem;\n  font-weight: 500;\n  cursor: pointer;\n  transition: all 0.2s ease;\n  box-shadow: var(--shadow-sm);\n\
    \  text-align: left;\n  width: 100%;\n}\n\n.action-btn:hover {\n  background: var(--button-hover);\n  transform: translateY(-1px);\n\
    \  box-shadow: var(--shadow-md);\n  border-color: var(--primary);\n}\n\n.action-btn:active {\n  transform: translateY(0);\n\
    }\n\n.btn-icon {\n  width: 20px;\n  height: 20px;\n  flex-shrink: 0;\n  stroke-width: 2;\n  color: var(--primary);\n \
    \ transition: transform 0.3s ease;\n}\n\n.action-btn:hover .btn-icon {\n  transform: scale(1.15);\n}\n\n.btn-text {\n\
    \  flex: 1;\n  white-space: nowrap;\n  overflow: hidden;\n  text-overflow: ellipsis;\n}\n\n/* ============================================\n\
    \   CUSTOM REQUEST SECTION\n   ============================================ */\n\n.custom-request-container {\n  display:\
    \ flex;\n  flex-direction: column;\n  gap: 12px;\n}\n\n.custom-textarea {\n  width: 100%;\n  min-height: 100px;\n  padding:\
    \ 12px 14px;\n  border-radius: 14px;\n  border: 1px solid var(--input-border);\n  background: var(--input-bg);\n  backdrop-filter:\
    \ blur(10px);\n  font-family: 'Open Sans', sans-serif;\n  font-size: 0.9rem;\n  color: var(--text);\n  resize: vertical;\n\
    \  transition: all 0.2s ease;\n  outline: none;\n}\n\n.custom-textarea::placeholder {\n  color: var(--text-muted);\n \
    \ opacity: 0.7;\n}\n\n.custom-textarea:focus {\n  border-color: var(--primary);\n  background: var(--button-hover);\n\
    \  box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);\n}\n\n.custom-btn {\n  background: linear-gradient(135deg, var(--primary),\
    \ var(--secondary));\n  color: white;\n  border: none;\n  font-weight: 600;\n}\n\n.custom-btn:hover {\n  background: linear-gradient(135deg,\
    \ var(--secondary), var(--primary));\n  transform: translateY(-2px);\n  box-shadow: var(--shadow-lg);\n}\n\n.custom-btn\
    \ .btn-icon {\n  color: white;\n}\n\n\n/* Neumorphism pressed effect */\n[data-theme=\"neomorphism\"] .action-btn:active\
    \ {\n  box-shadow: inset -2px -2px 5px rgba(255,255,255,0.7), inset 2px 2px 5px rgba(0,0,0,0.15);\n}\n\n/* ============================================\n\
    \   RESPONSIVE DESIGN\n   ============================================ */\n\n@media (max-width: 480px) {\n  .app-header\
    \ {\n    padding: 16px 20px;\n  }\n\n  .app-title {\n    font-size: 1.25rem;\n  }\n\n  .section-card {\n    padding: 16px;\n\
    \  }\n\n  .action-btn {\n    padding: 10px 14px;\n    min-height: 44px;\n    font-size: 0.85rem;\n  }\n\n  .btn-icon {\n\
    \    width: 18px;\n    height: 18px;\n  }\n}\n\n@media (min-width: 768px) {\n  .app-container {\n    max-width: 480px;\n\
    \  }\n}\n\n/* ============================================\n   ACCESSIBILITY & ANIMATIONS\n   ============================================\
    \ */\n\n/* Focus visible for keyboard navigation */\n*:focus-visible {\n  outline: 2px solid var(--primary);\n  outline-offset:\
    \ 2px;\n}\n\n/* Reduced motion for accessibility */\n@media (prefers-reduced-motion: reduce) {\n  *,\n  *::before,\n \
    \ *::after {\n    animation-duration: 0.01ms !important;\n    animation-iteration-count: 1 !important;\n    transition-duration:\
    \ 0.01ms !important;\n  }\n}\n\n/* Custom scrollbar */\n::-webkit-scrollbar {\n  width: 8px;\n  height: 8px;\n}\n\n::-webkit-scrollbar-track\
    \ {\n  background: var(--card-bg);\n}\n\n::-webkit-scrollbar-thumb {\n  background: var(--card-border);\n  border-radius:\
    \ 4px;\n}\n\n::-webkit-scrollbar-thumb:hover {\n  background: var(--text-muted);\n}\n"
  language: css
